[package]
name = "kinesis-lambda"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-config = "0.55.3"
aws-sdk-sqs = "0.28.0"
aws_lambda_events = { version = "0.8.3", default-features = false, features = ["kinesis", "streams"] }
base64 = "0.13.0"
chrono = "0.4.23"
futures = "0.3.28"
lambda_runtime = "0.8.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shared = { path = "../shared" }
snowflake-connector-rs = "0.6.5"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = "0.3"