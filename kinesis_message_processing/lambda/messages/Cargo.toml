[package]
name = "kinesis-lambda"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-config = "1.6.3"
aws-sdk-sqs = "1.73.0"
aws-sdk-dynamodb = "1.82.0"
aws-sdk-apigatewaymanagement = "1.74.0"
aws_lambda_events = { version = "0.16.0", default-features = false, features = ["kinesis", "streams"] }
base64 = "0.22.1"
chrono = "0.4.41"
futures = "0.3.31"
lambda_runtime = "0.14.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shared = { path = "../shared" }
snowflake-connector-rs = "0.6.5"
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }