[package]
name = "websocket-lambda"
version = "0.1.0"
edition = "2021"

[dependencies]
aws-config = "1.6.3"
aws-sdk-dynamodb = "1.82.0"
aws-sdk-apigatewaymanagement = "1.74.0"
aws_lambda_events = { version = "0.16.0", default-features = false, features = ["apigw"] }
lambda_runtime = "0.14.1"
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
shared = { path = "../shared" }
tokio = { version = "1", features = ["full"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json"] }
futures = "0.3"
chrono = { version = "0.4", features = ["serde"] }