<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Perspective Temperature Bands Test</title>
    <script src="https://unpkg.com/@finos/perspective/dist/umd/perspective.js"></script>
    <script src="https://unpkg.com/@finos/perspective-viewer/dist/umd/perspective-viewer.js"></script>
    <script src="https://unpkg.com/@finos/perspective-viewer-datagrid/dist/umd/perspective-viewer-datagrid.js"></script>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        perspective-viewer { height: 400px; width: 100%; margin: 20px 0; }
        .test-controls { margin: 20px 0; }
        button { padding: 10px 20px; margin: 5px; }
    </style>
</head>
<body>
    <h1>Perspective Temperature Bands Test</h1>
    
    <div class="test-controls">
        <button onclick="initTest()">Initialize Test</button>
        <button onclick="addTestData()">Add Test Data</button>
        <button onclick="clearData()">Clear Data</button>
    </div>
    
    <perspective-viewer id="testViewer"></perspective-viewer>
    
    <div id="status"></div>

    <script>
        let worker = null;
        let table = null;
        let viewer = null;

        async function initTest() {
            try {
                updateStatus('Initializing Perspective...');
                
                worker = await perspective.worker();
                viewer = document.getElementById('testViewer');
                
                // Create table with schema
                table = await worker.table([], {
                    limit: 1000
                });
                
                await viewer.load(table);
                
                // Configure for temperature band aggregation
                await viewer.restore({
                    plugin: "Datagrid",
                    group_by: ["temp_band"],
                    aggregates: {
                        temperature: "avg",
                        sensor_id: "count distinct",
                        speed_kms: "avg"
                    },
                    sort: [["temp_band", "asc"]],
                    plugin_config: {
                        scroll_lock: true
                    },
                    settings: true
                });
                
                updateStatus('Perspective initialized successfully!');
            } catch (error) {
                updateStatus('Error: ' + error.message);
                console.error(error);
            }
        }

        async function addTestData() {
            if (!table) {
                updateStatus('Please initialize first');
                return;
            }
            
            try {
                // Generate test data with various temperature ranges
                const testData = [];
                const sensors = ['device1', 'device2', 'device3', 'device4', 'device5'];
                const temperatures = [12.3, 18.7, 23.1, 28.9, 33.2, 38.5, 42.1, 47.8];
                
                sensors.forEach((sensor, i) => {
                    const temp = temperatures[i % temperatures.length];
                    const tempBand = Math.floor(temp / 5) * 5;
                    
                    testData.push({
                        sensor_id: sensor,
                        temperature: temp,
                        temp_band: `${tempBand}°C-${tempBand + 5}°C`,
                        latitude: 40.7128 + (Math.random() - 0.5) * 0.1,
                        longitude: -74.0060 + (Math.random() - 0.5) * 0.1,
                        speed_kms: Math.random() * 100
                    });
                });
                
                await table.replace(testData);
                updateStatus(`Added ${testData.length} test records`);
            } catch (error) {
                updateStatus('Error adding data: ' + error.message);
                console.error(error);
            }
        }

        async function clearData() {
            if (!table) return;
            
            try {
                await table.clear();
                updateStatus('Data cleared');
            } catch (error) {
                updateStatus('Error clearing data: ' + error.message);
            }
        }

        function updateStatus(message) {
            document.getElementById('status').innerHTML = `<p><strong>Status:</strong> ${message}</p>`;
        }

        // Auto-initialize on load
        window.addEventListener('load', () => {
            setTimeout(initTest, 500);
        });
    </script>
</body>
</html>
