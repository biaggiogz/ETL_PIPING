<!DOCTYPE html>
<html>
<head>
    <meta charset="utf-8">
    <title>Debug Perspective Temperature Bands</title>
    <script src="https://unpkg.com/@finos/perspective/dist/umd/perspective.js"></script>
    <script src="https://unpkg.com/@finos/perspective-viewer/dist/umd/perspective-viewer.js"></script>
    <script src="https://unpkg.com/@finos/perspective-viewer-datagrid/dist/umd/perspective-viewer-datagrid.js"></script>
    <link rel="stylesheet" crossorigin="anonymous" href="https://unpkg.com/@finos/perspective-viewer/dist/css/themes.css" />
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        perspective-viewer { height: 400px; width: 100%; margin: 20px 0; border: 1px solid #ccc; }
        .controls { margin: 20px 0; }
        button { padding: 10px 20px; margin: 5px; }
        #status { margin: 20px 0; padding: 10px; background: #f0f0f0; }
    </style>
</head>
<body>
    <h1>Debug Perspective Temperature Bands</h1>
    
    <div class="controls">
        <button onclick="initPerspective()">Initialize</button>
        <button onclick="addSampleData()">Add Sample Data</button>
        <button onclick="streamData()">Start Streaming</button>
        <button onclick="stopStreaming()">Stop Streaming</button>
    </div>
    
    <perspective-viewer id="viewer"></perspective-viewer>
    
    <div id="status">Ready</div>

    <script>
        let worker = null;
        let table = null;
        let viewer = null;
        let streamInterval = null;

        function updateStatus(message) {
            document.getElementById('status').innerHTML = `<strong>Status:</strong> ${message}`;
            console.log('Status:', message);
        }

        async function initPerspective() {
            try {
                updateStatus('Initializing Perspective...');
                
                worker = await perspective.worker();
                viewer = document.getElementById('viewer');
                
                // Create initial table with sample data to establish schema
                const initialData = [{
                    sensor_id: "sample",
                    temperature: 25.0,
                    temp_band: "25°C-30°C",
                    latitude: 40.7128,
                    longitude: -74.0060,
                    speed_kms: 50.0
                }];
                
                table = await worker.table(initialData, {
                    limit: 1000
                });

                await viewer.load(table);
                
                // Configure for temperature band aggregation
                viewer.restore({
                    plugin: "Datagrid",
                    group_by: ["temp_band"],
                    aggregates: {
                        temperature: "avg",
                        sensor_id: "count distinct",
                        speed_kms: "avg"
                    },
                    sort: [["temp_band", "asc"]],
                    plugin_config: {
                        scroll_lock: true
                    },
                    settings: true
                });
                
                // Clear the initial sample data
                await table.clear();
                
                updateStatus('Perspective initialized successfully!');
            } catch (error) {
                updateStatus('Error: ' + error.message);
                console.error('Init error:', error);
            }
        }

        async function addSampleData() {
            if (!table) {
                updateStatus('Please initialize first');
                return;
            }
            
            try {
                const sensors = ['device1', 'device2', 'device3', 'device4', 'device5'];
                const temperatures = [12.3, 18.7, 23.1, 28.9, 33.2, 38.5, 42.1, 47.8];
                const testData = [];
                
                sensors.forEach((sensor, i) => {
                    const temp = temperatures[i % temperatures.length];
                    const tempBand = Math.floor(temp / 5) * 5;
                    
                    testData.push({
                        sensor_id: sensor,
                        temperature: temp,
                        temp_band: `${tempBand}°C-${tempBand + 5}°C`,
                        latitude: 40.7128 + (Math.random() - 0.5) * 0.1,
                        longitude: -74.0060 + (Math.random() - 0.5) * 0.1,
                        speed_kms: Math.random() * 100
                    });
                });
                
                await table.update(testData);
                updateStatus(`Added ${testData.length} sample records`);
            } catch (error) {
                updateStatus('Error adding data: ' + error.message);
                console.error('Add data error:', error);
            }
        }

        function streamData() {
            if (!table) {
                updateStatus('Please initialize first');
                return;
            }

            if (streamInterval) {
                updateStatus('Streaming already active');
                return;
            }

            updateStatus('Starting streaming...');
            
            streamInterval = setInterval(async () => {
                try {
                    const sensors = ['device1', 'device2', 'device3', 'device4', 'device5', 'device6'];
                    const newData = [];
                    
                    // Generate 2-3 random updates
                    for (let i = 0; i < Math.floor(Math.random() * 3) + 2; i++) {
                        const sensor = sensors[Math.floor(Math.random() * sensors.length)];
                        const temp = Math.random() * 50 + 10; // 10-60°C
                        const tempBand = Math.floor(temp / 5) * 5;
                        
                        newData.push({
                            sensor_id: sensor,
                            temperature: temp,
                            temp_band: `${tempBand}°C-${tempBand + 5}°C`,
                            latitude: 40.7128 + (Math.random() - 0.5) * 0.1,
                            longitude: -74.0060 + (Math.random() - 0.5) * 0.1,
                            speed_kms: Math.random() * 100
                        });
                    }
                    
                    await table.update(newData);
                    updateStatus(`Streaming... (${newData.length} new records)`);
                } catch (error) {
                    console.error('Streaming error:', error);
                    stopStreaming();
                }
            }, 1000);
        }

        function stopStreaming() {
            if (streamInterval) {
                clearInterval(streamInterval);
                streamInterval = null;
                updateStatus('Streaming stopped');
            }
        }

        // Auto-initialize on load
        window.addEventListener('load', () => {
            setTimeout(initPerspective, 500);
        });
    </script>
</body>
</html>
