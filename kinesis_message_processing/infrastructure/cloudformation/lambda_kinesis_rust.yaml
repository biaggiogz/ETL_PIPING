AWSTemplateFormatVersion: '2010-09-09'
Transform: AWS::Serverless-2016-10-31

Globals:
  Function:
    Timeout: 10
    MemorySize: 3008

Conditions:
  HasWebSocketApi: !Not [!Equals [!Ref WebSocketApiId, ""]]

Parameters:
  ImageUri:
    Type: String
  WebSocketApiId:
    Type: String
    Description: "WebSocket API Gateway ID for real-time notifications"
    Default: ""
  SnowflakeUsername:
    Type: String
    Description: "Snowflake username"
  SnowflakePassword:
    Type: String
    Description: "Snowflake password"
  SnowflakeAccount:
    Type: String
    Description: "Snowflake account"
  SnowflakeRole:
    Type: String
    Description: "Snowflake role"
  SnowflakeWarehouse:
    Type: String
    Description: "Snowflake warehouse"
  SnowflakeDatabase:
    Type: String
    Description: "Snowflake database"
  SnowflakeSchema:
    Type: String
    Description: "Snowflake schema"
  SnowflakeTable:
    Type: String
    Description: "Snowflake table"
  BatchSize:
    Type: Number
    Default: 100
    Description: "Batch size for processing"
  MaxConnections:
    Type: Number
    Default: 20
  MaxBatchSize:
    Type: Number
    Default: 2000
  MinBatchsize:
    Type: Number
    Default: 100
  TimeoutMS:
    Type: Number
    Default: 1000
  CacheTableName:
    Type: String
    Default: sensor_readings_cache
    Description: "DynamoDB cache table name"
  CacheTTLSeconds:
    Type: Number
    Default: 60
    Description: "Cache TTL in seconds"
  CacheCheckIntervalSeconds:
    Type: Number
    Default: 60
    Description: "Cache check interval in seconds"

Resources:
  SensorReadingQueue:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: serverless-rust-KinesisSensorQueue

  FailedSensorReadingDLQ:
    Type: AWS::SQS::Queue
    Properties:
      QueueName: serverless-rust-KinesisSensorDLQ

  LambdaExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
      Policies:
        - PolicyName: 'ECRAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource:
                  Fn::Sub:
                    - "arn:aws:ecr:${Region}:${Account}:repository/${RepositoryName}"
                    - Region: !Select [3, !Split [".", !Ref ImageUri ]]
                      Account: !Select [0, !Split [".", !Ref ImageUri ]]
                      RepositoryName: !Select [1, !Split ["/", !Select [ 0, !Split [":", !Select [5, !Split [".", !Ref ImageUri ]]]]]]
        - PolicyName: cloudwatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}:*'
        - PolicyName: KinesisAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - kinesis:GetRecords
                  - kinesis:GetShardIterator
                  - kinesis:DescribeStream
                  - kinesis:ListShards
                Resource: !GetAtt MessageStream.Arn
        - PolicyName: SQSAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - sqs:SendMessage
                Resource: !GetAtt FailedSensorReadingDLQ.Arn
        - PolicyName: DynamoDBAccess
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - dynamodb:PutItem
                  - dynamodb:GetItem
                  - dynamodb:Query
                  - dynamodb:Scan
                  - dynamodb:BatchWriteItem
                  - dynamodb:DeleteItem
                  - dynamodb:UpdateItem
                Resource: 
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/${CacheTableName}'
                  - !Sub 'arn:aws:dynamodb:${AWS::Region}:${AWS::AccountId}:table/websocket_connections'
              - Effect: Allow
                Action:
                  - execute-api:ManageConnections
                Resource: !Sub 'arn:aws:execute-api:${AWS::Region}:${AWS::AccountId}:${WebSocketApiId}/*/*'
        - PolicyName: CloudWatchMetrics
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - cloudwatch:PutMetricData
                Resource: '*'
                Condition:
                  StringEquals:
                    'cloudwatch:namespace': 'SensorLatency'

  MessageStream:
    Type: AWS::Kinesis::Stream
    Properties:
      ShardCount: 2

  LambdaFunction:
    Type: AWS::Serverless::Function
    DependsOn:
      - LambdaExecutionRole
      - FailedSensorReadingDLQ
    Metadata:
      BuildMethod: rust-cargolambda
      BuildProperties:
        Binary: kinesis-lambda
    Properties:
      PackageType: Image
      FunctionName: serverless-rust-KinesisProcessor
      ImageUri: !Ref ImageUri
      Role: !GetAtt LambdaExecutionRole.Arn
      Architectures:
        - arm64
      Environment:
        Variables:
          SNOWFLAKE_USERNAME: !Ref SnowflakeUsername
          SNOWFLAKE_PASSWORD: !Ref SnowflakePassword
          SNOWFLAKE_ACCOUNT: !Ref SnowflakeAccount
          SNOWFLAKE_ROLE: !Ref SnowflakeRole
          SNOWFLAKE_WAREHOUSE: !Ref SnowflakeWarehouse
          SNOWFLAKE_DATABASE: !Ref SnowflakeDatabase
          SNOWFLAKE_SCHEMA: !Ref SnowflakeSchema
          SNOWFLAKE_TABLE: !Ref SnowflakeTable
          BATCH_SIZE: !Ref BatchSize
          MAX_CONNECTIONS: !Ref MaxConnections
          MAX_BATCH_SIZE: !Ref MaxBatchSize
          MIN_BATCH_SIZE: !Ref MinBatchsize
          TIMEOUT_MS: !Ref TimeoutMS
          DLQ_URL: !Ref FailedSensorReadingDLQ
          CACHE_TABLE_NAME: !Ref CacheTableName
          CACHE_TTL_SECONDS: !Ref CacheTTLSeconds
          CACHE_CHECK_INTERVAL_SECONDS: !Ref CacheCheckIntervalSeconds
          CONNECTION_TABLE_NAME: websocket_connections
          WEBSOCKET_API_ENDPOINT: !If 
            - HasWebSocketApi
            - !Sub 'https://${WebSocketApiId}.execute-api.${AWS::Region}.amazonaws.com/prod'
            - ''
      EventInvokeConfig:
        MaximumRetryAttempts: 2
        MaximumEventAgeInSeconds: 300
        DestinationConfig:
          OnFailure:
            Type: SQS
            Destination: !GetAtt FailedSensorReadingDLQ.Arn
      Events:
        Stream:
          Type: Kinesis
          Properties:
            Stream: !GetAtt MessageStream.Arn
            BatchSize: !Ref BatchSize
            StartingPosition: LATEST

Outputs:
  StreamARN:
    Description: "Stream ARN"
    Value: !GetAtt MessageStream.Arn
  DLQUrl:
    Description: "Dead Letter Queue URL"
    Value: !Ref FailedSensorReadingDLQ
  QueueUrl:
    Description: "Main Queue URL"
    Value: !Ref SensorReadingQueue