<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Sensor Data - Raw JSON Test</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .connection-status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .connected { background-color: #d4edda; color: #155724; }
        .disconnected { background-color: #f8d7da; color: #721c24; }
        .connecting { background-color: #fff3cd; color: #856404; }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .controls button, .controls select, .controls input {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }
        .controls button:hover {
            background-color: #f8f9fa;
        }
        
        .raw-json-section {
            margin-top: 20px;
            border: 2px solid #007bff;
            border-radius: 8px;
            padding: 15px;
            background: #f8f9ff;
        }
        
        .raw-json-controls {
            margin-bottom: 15px;
        }
        
        .raw-json-container {
            background: #2d3748;
            color: #e2e8f0;
            border-radius: 5px;
            padding: 15px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            max-height: 500px;
            overflow-y: auto;
            display: none;
        }
        
        .json-entry {
            margin-bottom: 15px;
            padding: 10px;
            background-color: #4a5568;
            border-radius: 4px;
            border-left: 4px solid #68d391;
        }
        
        .json-timestamp {
            color: #a0aec0;
            font-size: 10px;
            margin-bottom: 8px;
        }
        
        .log-container {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 5px;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
            margin-bottom: 20px;
        }
        .log-entry {
            margin-bottom: 5px;
            padding: 2px 5px;
            border-radius: 3px;
        }
        .log-info { background-color: #d1ecf1; }
        .log-error { background-color: #f8d7da; }
        .log-success { background-color: #d4edda; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🔍 WebSocket Raw JSON Data Test</h1>
            <h2>Debug All Incoming Data</h2>
        </div>

        <div id="connectionStatus" class="connection-status disconnected">
            ❌ Disconnected
        </div>

        <div class="controls">
            <input type="text" id="websocketUrl" placeholder="wss://your-api-id.execute-api.region.amazonaws.com/prod" style="width: 400px;">
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
            <button onclick="getAllLatest()">Get All Latest</button>
            <select id="sensorSelect">
                <option value="">Select Sensor</option>
                <option value="device1">Device 1</option>
                <option value="device2">Device 2</option>
                <option value="device3">Device 3</option>
                <option value="device4">Device 4</option>
                <option value="device5">Device 5</option>
            </select>
            <button onclick="subscribeToSelected()">Subscribe</button>
        </div>

        <div class="log-container" id="logContainer">
            <!-- Log entries will appear here -->
        </div>

        <div class="raw-json-section">
            <h3>📋 Raw JSON Messages</h3>
            <div class="raw-json-controls">
                <button onclick="toggleRawJson()" id="rawJsonToggle">Show Raw JSON</button>
                <button onclick="clearRawJson()">Clear JSON</button>
                <span style="margin-left: 20px; color: #666;">All WebSocket messages will appear here in raw JSON format</span>
            </div>
            <div id="rawJsonContainer" class="raw-json-container">
                <!-- Raw JSON will appear here -->
            </div>
        </div>
    </div>

    <script>
        let websocket = null;
        let isConnected = false;
        let messageCount = 0;

        function updateConnectionStatus(status, message) {
            const statusElement = document.getElementById('connectionStatus');
            statusElement.className = `connection-status ${status}`;
            
            const statusIcons = {
                connected: '✅',
                disconnected: '❌',
                connecting: '🔄'
            };
            
            statusElement.textContent = `${statusIcons[status]} ${message}`;
        }

        function connect() {
            const url = document.getElementById('websocketUrl').value;
            if (!url) {
                addLog('error', 'Please enter WebSocket URL');
                return;
            }

            updateConnectionStatus('connecting', 'Connecting...');
            addLog('info', `Connecting to ${url}`);

            websocket = new WebSocket(url);

            websocket.onopen = function(event) {
                isConnected = true;
                updateConnectionStatus('connected', 'Connected - Ready to capture JSON');
                addLog('success', 'WebSocket connected successfully');
            };

            websocket.onmessage = function(event) {
                messageCount++;
                addRawJson(event.data);
                
                try {
                    const data = JSON.parse(event.data);
                    addLog('success', `Message ${messageCount}: ${data.type || 'unknown'}`);
                } catch (error) {
                    addLog('error', `Failed to parse message: ${error.message}`);
                }
            };

            websocket.onclose = function(event) {
                isConnected = false;
                updateConnectionStatus('disconnected', 'Disconnected');
                addLog('info', 'WebSocket disconnected');
            };

            websocket.onerror = function(error) {
                addLog('error', `WebSocket error: ${error}`);
                updateConnectionStatus('disconnected', 'Connection Error');
            };
        }

        function disconnect() {
            if (websocket) {
                websocket.close();
                websocket = null;
            }
        }

        function subscribeToSelected() {
            const select = document.getElementById('sensorSelect');
            const sensorId = select.value;
            
            if (!sensorId) {
                addLog('error', 'Please select a sensor');
                return;
            }
            
            if (!isConnected) {
                addLog('error', 'Not connected to WebSocket');
                return;
            }
            
            const message = JSON.stringify({
                action: 'subscribe',
                sensor_id: sensorId
            });
            
            websocket.send(message);
            addLog('info', `Sent subscribe request for ${sensorId}`);
        }

        function getAllLatest() {
            if (!isConnected) {
                addLog('error', 'Not connected to WebSocket');
                return;
            }
            
            const message = JSON.stringify({
                action: 'get_latest'
            });
            
            websocket.send(message);
            addLog('info', 'Sent get_latest request');
        }

        function addLog(type, message) {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        function addRawJson(jsonString) {
            const container = document.getElementById('rawJsonContainer');
            const entry = document.createElement('div');
            entry.className = 'json-entry';
            
            const timestamp = new Date().toLocaleTimeString();
            
            try {
                const formatted = JSON.stringify(JSON.parse(jsonString), null, 2);
                
                entry.innerHTML = `
                    <div class="json-timestamp">[${timestamp}] Message #${messageCount}:</div>
                    <pre style="margin: 0; white-space: pre-wrap; word-wrap: break-word;">${formatted}</pre>
                `;
            } catch (error) {
                entry.innerHTML = `
                    <div class="json-timestamp">[${timestamp}] Invalid JSON:</div>
                    <pre style="margin: 0; white-space: pre-wrap; word-wrap: break-word; color: #ff6b6b;">${jsonString}</pre>
                `;
            }
            
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        function toggleRawJson() {
            const container = document.getElementById('rawJsonContainer');
            const button = document.getElementById('rawJsonToggle');
            
            if (container.style.display === 'none') {
                container.style.display = 'block';
                button.textContent = 'Hide Raw JSON';
            } else {
                container.style.display = 'none';
                button.textContent = 'Show Raw JSON';
            }
        }

        function clearRawJson() {
            document.getElementById('rawJsonContainer').innerHTML = '';
            messageCount = 0;
            addLog('info', 'Raw JSON cleared');
        }

        // Initialize
        updateConnectionStatus('disconnected', 'Not Connected');
        addLog('info', 'Raw JSON WebSocket tester initialized');
    </script>
</body>
</html>
