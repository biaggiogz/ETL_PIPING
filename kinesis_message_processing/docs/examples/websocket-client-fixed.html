<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Real-Time Sensor Data - Fixed Field Mapping</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f5f5f5;
        }
        .container {
            max-width: 1400px;
            margin: 0 auto;
            background: white;
            border-radius: 10px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.1);
            padding: 20px;
        }
        .header {
            text-align: center;
            margin-bottom: 30px;
        }
        .connection-status {
            padding: 10px;
            border-radius: 5px;
            margin-bottom: 20px;
            font-weight: bold;
        }
        .connected { background-color: #d4edda; color: #155724; }
        .disconnected { background-color: #f8d7da; color: #721c24; }
        .connecting { background-color: #fff3cd; color: #856404; }
        
        .controls {
            display: flex;
            gap: 10px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }
        .controls button, .controls select, .controls input {
            padding: 8px 16px;
            border: 1px solid #ddd;
            border-radius: 4px;
            background: white;
            cursor: pointer;
        }
        .controls button:hover {
            background-color: #f8f9fa;
        }
        
        .sensor-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(350px, 1fr));
            gap: 20px;
            margin-bottom: 20px;
        }
        .sensor-card {
            border: 1px solid #ddd;
            border-radius: 8px;
            padding: 15px;
            background: white;
        }
        .sensor-header {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 10px;
        }
        .sensor-id {
            font-weight: bold;
            font-size: 18px;
        }
        .subscribe-btn {
            padding: 4px 8px;
            font-size: 12px;
            border: none;
            border-radius: 4px;
            cursor: pointer;
        }
        .subscribed {
            background-color: #28a745;
            color: white;
        }
        .unsubscribed {
            background-color: #6c757d;
            color: white;
        }
        
        .sensor-data {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 8px;
            font-size: 13px;
        }
        .data-item {
            display: flex;
            justify-content: space-between;
            padding: 3px 0;
        }
        .data-label {
            color: #666;
            font-weight: 500;
        }
        .data-value {
            font-weight: bold;
            color: #333;
        }
        
        .log-container {
            background: #f8f9fa;
            border: 1px solid #ddd;
            border-radius: 5px;
            height: 200px;
            overflow-y: auto;
            padding: 10px;
            font-family: 'Courier New', monospace;
            font-size: 12px;
        }
        .log-entry {
            margin-bottom: 5px;
            padding: 2px 5px;
            border-radius: 3px;
        }
        .log-info { background-color: #d1ecf1; }
        .log-error { background-color: #f8d7da; }
        .log-success { background-color: #d4edda; }
    </style>
</head>
<body>
    <div class="container">
        <div class="header">
            <h1>🚀 Real-Time Sensor Data Stream</h1>
            <h2>Fixed Field Mapping for camelCase JSON</h2>
        </div>

        <div id="connectionStatus" class="connection-status disconnected">
            ❌ Disconnected
        </div>

        <div class="controls">
            <input type="text" id="websocketUrl" placeholder="wss://your-api-id.execute-api.region.amazonaws.com/prod" style="width: 400px;">
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
            <button onclick="getAllLatest()">Get All Latest</button>
            <button onclick="clearLogs()">Clear Logs</button>
            <select id="sensorSelect">
                <option value="">Select Sensor</option>
                <option value="device1">Device 1</option>
                <option value="device2">Device 2</option>
                <option value="device3">Device 3</option>
                <option value="device4">Device 4</option>
                <option value="device5">Device 5</option>
            </select>
            <button onclick="subscribeToSelected()">Subscribe</button>
        </div>

        <div class="sensor-grid" id="sensorGrid">
            <!-- Sensor cards will be populated dynamically -->
        </div>

        <div class="log-container" id="logContainer">
            <!-- Log entries will appear here -->
        </div>
    </div>

    <script>
        let websocket = null;
        let isConnected = false;
        let subscribedSensors = new Set();
        let sensorData = new Map();
        let messageCount = 0;

        function updateConnectionStatus(status, message) {
            const statusElement = document.getElementById('connectionStatus');
            statusElement.className = `connection-status ${status}`;
            
            const statusIcons = {
                connected: '✅',
                disconnected: '❌',
                connecting: '🔄'
            };
            
            statusElement.textContent = `${statusIcons[status]} ${message}`;
        }

        function connect() {
            const url = document.getElementById('websocketUrl').value;
            if (!url) {
                addLog('error', 'Please enter WebSocket URL');
                return;
            }

            updateConnectionStatus('connecting', 'Connecting...');
            addLog('info', `Connecting to ${url}`);

            websocket = new WebSocket(url);

            websocket.onopen = function(event) {
                isConnected = true;
                updateConnectionStatus('connected', 'Connected - Ready to display all fields');
                addLog('success', 'WebSocket connected successfully');
            };

            websocket.onmessage = function(event) {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (error) {
                    addLog('error', `Failed to parse message: ${error.message}`);
                }
            };

            websocket.onclose = function(event) {
                isConnected = false;
                updateConnectionStatus('disconnected', 'Disconnected');
                addLog('info', 'WebSocket disconnected');
            };

            websocket.onerror = function(error) {
                addLog('error', `WebSocket error: ${error}`);
                updateConnectionStatus('disconnected', 'Connection Error');
            };
        }

        function disconnect() {
            if (websocket) {
                websocket.close();
                websocket = null;
            }
        }

        function handleMessage(data) {
            messageCount++;
            addLog('info', `Received: ${data.type}`);
            
            switch(data.type) {
                case 'all_latest_readings':
                    handleAllLatestReadings(data);
                    break;
                case 'latest_readings':
                    handleLatestReadings(data);
                    break;
                case 'real_time_reading':
                    handleRealTimeReading(data);
                    break;
                case 'error':
                    addLog('error', `Server error: ${data.message}`);
                    break;
                case 'success':
                    addLog('success', data.message);
                    break;
            }
        }

        function handleAllLatestReadings(data) {
            if (data.sensors) {
                Object.entries(data.sensors).forEach(([sensorId, readings]) => {
                    if (readings.length > 0) {
                        const latest = readings[0];
                        sensorData.set(sensorId, latest);
                        updateSensorCard(sensorId, latest);
                    }
                });
            }
            addLog('success', `All latest readings: ${Object.keys(data.sensors || {}).length} sensors`);
        }

        function handleLatestReadings(data) {
            if (data.readings && data.readings.length > 0) {
                const latest = data.readings[0];
                sensorData.set(data.sensor_id, latest);
                updateSensorCard(data.sensor_id, latest);
            }
            addLog('success', `Latest readings for ${data.sensor_id}: ${data.count} records`);
        }

        function handleRealTimeReading(data) {
            const sensorId = data.sensorId;
            sensorData.set(sensorId, data);
            updateSensorCard(sensorId, data);
            addLog('success', `Real-time data for ${sensorId}: ${data.temperature}°C`);
        }

        function updateSensorCard(sensorId, data) {
            const grid = document.getElementById('sensorGrid');
            let card = document.getElementById(`sensor-${sensorId}`);
            
            if (!card) {
                card = createSensorCard(sensorId);
                grid.appendChild(card);
            }
            
            // Map camelCase JSON fields to display values with 3 decimal precision
            const fields = {
                'temperature': `${data.temperature?.toFixed(3)}°C`,
                'timestamp-ns': data.readingTimestampNs || 'N/A',
                'timestamp-us': data.readingTimestampUs || 'N/A', 
                'timestamp-ms': data.readingTimestampMs || 'N/A',
                'latitude': data.position?.latitude?.toFixed(3) || 'N/A',
                'longitude': data.position?.longitude?.toFixed(3) || 'N/A',
                'speed': `${data.speedKms?.toFixed(3)} km/h`,
                'connection': `${data.connectionSpeedMbps?.toFixed(3)} Mbps`,
                'latency': `${data.latencyUs || 0} μs`,
                'cache-time': data.cacheTimestampNs || 'N/A'
            };
            
            Object.entries(fields).forEach(([key, value]) => {
                const element = card.querySelector(`[data-field="${key}"]`);
                if (element) {
                    element.textContent = value;
                }
            });
        }

        function createSensorCard(sensorId) {
            const card = document.createElement('div');
            card.className = 'sensor-card';
            card.id = `sensor-${sensorId}`;
            
            card.innerHTML = `
                <div class="sensor-header">
                    <div class="sensor-id">${sensorId}</div>
                    <button class="subscribe-btn ${subscribedSensors.has(sensorId) ? 'subscribed' : 'unsubscribed'}" 
                            onclick="toggleSubscription('${sensorId}')">
                        ${subscribedSensors.has(sensorId) ? 'Unsubscribe' : 'Subscribe'}
                    </button>
                </div>
                <div class="sensor-data">
                    <div class="data-item">
                        <span class="data-label">Temperature:</span>
                        <span class="data-value" data-field="temperature">--</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">Timestamp (ns):</span>
                        <span class="data-value" data-field="timestamp-ns">--</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">Timestamp (μs):</span>
                        <span class="data-value" data-field="timestamp-us">--</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">Timestamp (ms):</span>
                        <span class="data-value" data-field="timestamp-ms">--</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">Latitude:</span>
                        <span class="data-value" data-field="latitude">--</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">Longitude:</span>
                        <span class="data-value" data-field="longitude">--</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">Speed:</span>
                        <span class="data-value" data-field="speed">--</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">Connection:</span>
                        <span class="data-value" data-field="connection">--</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">Latency:</span>
                        <span class="data-value" data-field="latency">--</span>
                    </div>
                    <div class="data-item">
                        <span class="data-label">Cache Time:</span>
                        <span class="data-value" data-field="cache-time">--</span>
                    </div>
                </div>
            `;
            
            return card;
        }

        function toggleSubscription(sensorId) {
            if (!isConnected) {
                addLog('error', 'Not connected to WebSocket');
                return;
            }
            
            const action = subscribedSensors.has(sensorId) ? 'unsubscribe' : 'subscribe';
            
            websocket.send(JSON.stringify({
                action: action,
                sensor_id: sensorId
            }));
            
            if (action === 'subscribe') {
                subscribedSensors.add(sensorId);
            } else {
                subscribedSensors.delete(sensorId);
            }
            
            updateSubscriptionButton(sensorId);
        }

        function updateSubscriptionButton(sensorId) {
            const card = document.getElementById(`sensor-${sensorId}`);
            if (card) {
                const button = card.querySelector('.subscribe-btn');
                const isSubscribed = subscribedSensors.has(sensorId);
                button.className = `subscribe-btn ${isSubscribed ? 'subscribed' : 'unsubscribed'}`;
                button.textContent = isSubscribed ? 'Unsubscribe' : 'Subscribe';
            }
        }

        function subscribeToSelected() {
            const select = document.getElementById('sensorSelect');
            const sensorId = select.value;
            
            if (!sensorId) {
                addLog('error', 'Please select a sensor');
                return;
            }
            
            toggleSubscription(sensorId);
        }

        function getAllLatest() {
            if (!isConnected) {
                addLog('error', 'Not connected to WebSocket');
                return;
            }
            
            websocket.send(JSON.stringify({
                action: 'get_latest'
            }));
        }

        function addLog(type, message) {
            const container = document.getElementById('logContainer');
            const entry = document.createElement('div');
            entry.className = `log-entry log-${type}`;
            
            const timestamp = new Date().toLocaleTimeString();
            entry.textContent = `[${timestamp}] ${message}`;
            
            container.appendChild(entry);
            container.scrollTop = container.scrollHeight;
        }

        function clearLogs() {
            document.getElementById('logContainer').innerHTML = '';
        }

        // Initialize
        updateConnectionStatus('disconnected', 'Not Connected');
        addLog('info', 'WebSocket client with fixed camelCase field mapping');
    </script>
</body>
</html>
