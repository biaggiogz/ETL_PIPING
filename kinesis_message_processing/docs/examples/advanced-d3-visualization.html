<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Advanced D3.js Real-Time Sensor Dashboard</title>
    <script src="https://d3js.org/d3.v7.min.js"></script>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { 
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
            background: linear-gradient(135deg, #667eea 0%, #764ba2 100%);
            color: #333;
        }
        .dashboard { 
            display: grid; 
            grid-template-columns: 300px 1fr;
            height: 100vh;
        }
        .sidebar { 
            background: rgba(255,255,255,0.95); 
            padding: 20px; 
            backdrop-filter: blur(10px);
            border-right: 1px solid rgba(255,255,255,0.2);
        }
        .main-content { 
            padding: 20px; 
            overflow-y: auto;
        }
        .chart-container { 
            background: rgba(255,255,255,0.95); 
            border-radius: 12px; 
            padding: 20px; 
            margin-bottom: 20px;
            backdrop-filter: blur(10px);
            box-shadow: 0 8px 32px rgba(0,0,0,0.1);
        }
        .metrics-grid { 
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); 
            gap: 15px; 
            margin-bottom: 20px;
        }
        .metric-card { 
            background: linear-gradient(135deg, #4facfe 0%, #00f2fe 100%);
            color: white; 
            padding: 20px; 
            border-radius: 12px; 
            text-align: center;
            box-shadow: 0 4px 15px rgba(0,0,0,0.1);
        }
        .metric-value { font-size: 2em; font-weight: bold; }
        .metric-label { font-size: 0.9em; opacity: 0.9; margin-top: 5px; }
        .connection-status { 
            padding: 15px; 
            border-radius: 8px; 
            margin-bottom: 20px; 
            font-weight: bold;
            text-align: center;
        }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        .controls { margin-bottom: 20px; }
        .controls input, .controls button, .controls select { 
            width: 100%; 
            padding: 10px; 
            margin: 5px 0; 
            border: 1px solid #ddd; 
            border-radius: 6px;
            font-size: 14px;
        }
        .controls button { 
            background: #007bff; 
            color: white; 
            cursor: pointer; 
            transition: background 0.3s;
        }
        .controls button:hover { background: #0056b3; }
        .controls button:disabled { background: #6c757d; cursor: not-allowed; }
        .sensor-list { max-height: 300px; overflow-y: auto; }
        .sensor-item { 
            padding: 10px; 
            margin: 5px 0; 
            background: #f8f9fa; 
            border-radius: 6px;
            cursor: pointer;
            transition: all 0.3s;
        }
        .sensor-item:hover { background: #e9ecef; }
        .sensor-item.subscribed { background: #d4edda; border-left: 4px solid #28a745; }
        .real-time-indicator { 
            display: inline-block; 
            width: 10px; 
            height: 10px; 
            background: #28a745; 
            border-radius: 50%; 
            animation: pulse 2s infinite;
        }
        @keyframes pulse { 0%, 100% { opacity: 1; } 50% { opacity: 0.3; } }
        .chart-title { font-size: 1.2em; font-weight: bold; margin-bottom: 15px; color: #333; }
    </style>
</head>
<body>
    <div class="dashboard">
        <div class="sidebar">
            <h2>🚀 Sensor Control</h2>
            
            <div id="connectionStatus" class="connection-status disconnected">
                ❌ Disconnected
            </div>

            <div class="controls">
                <input type="text" id="websocketUrl" placeholder="WebSocket URL" />
                <button onclick="toggleConnection()">Connect</button>
                <button onclick="getAllLatest()" id="getLatestBtn" disabled>Get All Latest</button>
                
                <select id="sensorSelect">
                    <option value="">Select Sensor</option>
                    <option value="device1">Device 1</option>
                    <option value="device2">Device 2</option>
                    <option value="device3">Device 3</option>
                    <option value="device4">Device 4</option>
                    <option value="device5">Device 5</option>
                    <option value="device6">Device 6</option>
                    <option value="device7">Device 7</option>
                    <option value="device8">Device 8</option>
                    <option value="device9">Device 9</option>
                    <option value="device10">Device 10</option>
                </select>
                <button onclick="subscribeToSelected()" id="subscribeBtn" disabled>Subscribe</button>
            </div>

            <div class="sensor-list" id="sensorList">
                <div style="text-align: center; color: #666; padding: 20px;">
                    No sensors detected
                </div>
            </div>
        </div>

        <div class="main-content">
            <div class="metrics-grid" id="metricsGrid">
                <!-- Metrics will be populated here -->
            </div>

            <div class="chart-container">
                <div class="chart-title">📈 Real-Time Temperature Timeline</div>
                <div id="temperatureChart">Connect to see real-time data</div>
            </div>

            <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 20px;">
                <div class="chart-container">
                    <div class="chart-title">⚡ Latency Distribution</div>
                    <div id="latencyChart">No data available</div>
                </div>
                
                <div class="chart-container">
                    <div class="chart-title">🗺️ Sensor Heatmap</div>
                    <div id="heatmapChart">No data available</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        // Global state
        let websocket = null;
        let isConnected = false;
        let sensorData = new Map();
        let subscribedSensors = new Set();
        let messageCount = 0;
        let latencySum = 0;
        let messageTimestamps = [];

        // WebSocket Management
        function toggleConnection() {
            if (isConnected) {
                disconnect();
            } else {
                connect();
            }
        }

        function connect() {
            const url = document.getElementById('websocketUrl').value;
            if (!url) {
                alert('Please enter WebSocket URL');
                return;
            }

            websocket = new WebSocket(url);
            
            websocket.onopen = () => {
                isConnected = true;
                updateConnectionStatus();
                console.log('Connected to WebSocket');
            };

            websocket.onmessage = (event) => {
                try {
                    const data = JSON.parse(event.data);
                    handleMessage(data);
                } catch (error) {
                    console.error('Message parsing error:', error);
                }
            };

            websocket.onclose = () => {
                isConnected = false;
                updateConnectionStatus();
                console.log('WebSocket disconnected');
            };

            websocket.onerror = (error) => {
                console.error('WebSocket error:', error);
            };
        }

        function disconnect() {
            if (websocket) {
                websocket.close();
            }
        }

        function updateConnectionStatus() {
            const status = document.getElementById('connectionStatus');
            const getLatestBtn = document.getElementById('getLatestBtn');
            const subscribeBtn = document.getElementById('subscribeBtn');
            
            if (isConnected) {
                status.className = 'connection-status connected';
                status.innerHTML = '✅ Connected <span class="real-time-indicator"></span>';
                getLatestBtn.disabled = false;
                subscribeBtn.disabled = false;
            } else {
                status.className = 'connection-status disconnected';
                status.innerHTML = '❌ Disconnected';
                getLatestBtn.disabled = true;
                subscribeBtn.disabled = true;
            }
        }

        function getAllLatest() {
            if (websocket && isConnected) {
                websocket.send(JSON.stringify({ action: 'get_latest' }));
            }
        }

        function subscribeToSelected() {
            const sensorId = document.getElementById('sensorSelect').value;
            if (!sensorId) {
                alert('Please select a sensor');
                return;
            }
            subscribeToSensor(sensorId);
        }

        function subscribeToSensor(sensorId) {
            if (websocket && isConnected) {
                websocket.send(JSON.stringify({
                    action: 'subscribe',
                    sensor_id: sensorId
                }));
                subscribedSensors.add(sensorId);
                updateSensorList();
            }
        }

        function handleMessage(data) {
            messageCount++;
            const now = performance.now();
            messageTimestamps.push(now);
            
            const tenSecondsAgo = now - 10000;
            messageTimestamps = messageTimestamps.filter(t => t > tenSecondsAgo);

            switch (data.type) {
                case 'real_time_reading':
                    handleRealTimeReading(data);
                    break;
                case 'latest_readings':
                    handleLatestReadings(data);
                    break;
                case 'all_latest_readings':
                    handleAllLatestReadings(data);
                    break;
                case 'error':
                    console.error('Server error:', data.message);
                    break;
                case 'success':
                    console.log('Server success:', data.message);
                    break;
                default:
                    console.log('Unknown message type:', data);
            }

            updateMetrics();
        }

        function handleRealTimeReading(data) {
            const latencyUs = data.cache_to_notification_latency_us || 0;
            latencySum += latencyUs;
            
            sensorData.set(data.sensor_id, {
                ...data,
                lastUpdated: Date.now()
            });

            updateSensorList();
        }

        function handleLatestReadings(data) {
            console.log('Latest readings:', data);
            if (data.readings && data.readings.length > 0) {
                const latest = data.readings[0];
                sensorData.set(data.sensor_id, {
                    ...latest,
                    lastUpdated: Date.now()
                });
                updateSensorList();
            }
        }

        function handleAllLatestReadings(data) {
            console.log('All latest readings:', data);
            for (const [sensorId, readings] of Object.entries(data.sensors)) {
                if (readings && readings.length > 0) {
                    const latest = readings[0];
                    sensorData.set(sensorId, {
                        ...latest,
                        lastUpdated: Date.now()
                    });
                }
            }
            updateSensorList();
            populateSensorSelect();
        }

        function updateSensorList() {
            const sensorList = document.getElementById('sensorList');
            
            if (sensorData.size === 0) {
                sensorList.innerHTML = '<div style="text-align: center; color: #666; padding: 20px;">No sensors detected</div>';
                return;
            }

            let html = '';
            sensorData.forEach((data, sensorId) => {
                const isSubscribed = subscribedSensors.has(sensorId);
                html += `
                    <div class="sensor-item ${isSubscribed ? 'subscribed' : ''}" onclick="toggleSensorSubscription('${sensorId}')">
                        <strong>${sensorId}</strong><br>
                        <small>Temp: ${data.temperature?.toFixed(1) || 'N/A'}°C</small><br>
                        <small>Updated: ${new Date(data.lastUpdated).toLocaleTimeString()}</small>
                        ${isSubscribed ? '<br><small style="color: #28a745;">✓ Subscribed</small>' : ''}
                    </div>
                `;
            });
            sensorList.innerHTML = html;
        }

        function populateSensorSelect() {
            const select = document.getElementById('sensorSelect');
            const currentValue = select.value;
            
            select.innerHTML = '<option value="">Select Sensor</option>';
            sensorData.forEach((data, sensorId) => {
                const option = document.createElement('option');
                option.value = sensorId;
                option.textContent = sensorId;
                select.appendChild(option);
            });
            
            if (currentValue) {
                select.value = currentValue;
            }
        }

        function toggleSensorSubscription(sensorId) {
            if (subscribedSensors.has(sensorId)) {
                unsubscribeFromSensor(sensorId);
            } else {
                subscribeToSensor(sensorId);
            }
        }

        function unsubscribeFromSensor(sensorId) {
            if (websocket && isConnected) {
                websocket.send(JSON.stringify({
                    action: 'unsubscribe',
                    sensor_id: sensorId
                }));
                subscribedSensors.delete(sensorId);
                updateSensorList();
            }
        }

        function updateMetrics() {
            const metricsGrid = document.getElementById('metricsGrid');
            
            const totalSensors = sensorData.size;
            const temperatures = Array.from(sensorData.values()).map(d => d.temperature).filter(t => t != null);
            const avgTemp = temperatures.length > 0 ? temperatures.reduce((a, b) => a + b, 0) / temperatures.length : 0;
            const avgLatency = messageCount > 0 ? Math.round(latencySum / messageCount) : 0;
            const messagesPerSecond = (messageTimestamps.length / 10).toFixed(1);

            metricsGrid.innerHTML = `
                <div class="metric-card">
                    <div class="metric-value">${totalSensors}</div>
                    <div class="metric-label">Active Sensors</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value">${avgTemp.toFixed(1)}°C</div>
                    <div class="metric-label">Avg Temperature</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value">${avgLatency}μs</div>
                    <div class="metric-label">Avg Latency</div>
                </div>
                <div class="metric-card">
                    <div class="metric-value">${messagesPerSecond}</div>
                    <div class="metric-label">Messages/Second</div>
                </div>
            `;
        }

        // Initialize
        console.log('Advanced D3.js Sensor Dashboard initialized');
        document.getElementById('websocketUrl').value = 'wss://your-api-id.execute-api.region.amazonaws.com/prod';
        
        // Start auto-refresh immediately
        setInterval(() => {
            if (isConnected) {
                getAllLatest();
            }
        }, 500);
    </script>
</body>
</html>
