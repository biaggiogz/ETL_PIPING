AWSTemplateFormatVersion: '2010-09-09'
Description: |
  DynamoDB Cache Table for Sensor Readings - Per-Sensor Independent TTL
  
  This table supports independent 1-minute caching per sensor:
  - Each sensor (device1, device2, etc.) maintains its own cache entries
  - TTL expires readings exactly 1 minute after creation
  - Supports unlimited number of sensors
  - Optimized for real-time WebSocket access and batch processing

Resources:
  SensorReadingsCache:
    Type: AWS::DynamoDB::Table
    Properties:
      TableName: sensor_readings_cache
      BillingMode: PAY_PER_REQUEST
      AttributeDefinitions:
        - AttributeName: sensor_id
          AttributeType: S
        - AttributeName: reading_timestamp
          AttributeType: N
      KeySchema:
        - AttributeName: sensor_id
          KeyType: HASH
        - AttributeName: reading_timestamp
          KeyType: RANGE
      TimeToLiveSpecification:
        AttributeName: expire_at
        Enabled: true
      StreamSpecification:
        StreamViewType: NEW_AND_OLD_IMAGES
      Tags:
        - Key: Purpose
          Value: SensorDataCache
        - Key: Environment
          Value: Production
        - Key: CacheStrategy
          Value: PerSensorIndependentTTL

Outputs:
  CacheTableName:
    Description: 'Name of the DynamoDB cache table'
    Value: !Ref SensorReadingsCache
    Export:
      Name: !Sub '${AWS::StackName}-CacheTableName'
  
  CacheTableArn:
    Description: 'ARN of the DynamoDB cache table'
    Value: !GetAtt SensorReadingsCache.Arn
    Export:
      Name: !Sub '${AWS::StackName}-CacheTableArn'