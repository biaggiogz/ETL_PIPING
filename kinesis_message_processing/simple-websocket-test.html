<!DOCTYPE html>
<html>
<head>
    <title>Simple WebSocket Test</title>
    <style>
        body { font-family: Arial, sans-serif; margin: 20px; }
        .container { max-width: 800px; margin: 0 auto; }
        .status { padding: 10px; margin: 10px 0; border-radius: 5px; }
        .connected { background: #d4edda; color: #155724; }
        .disconnected { background: #f8d7da; color: #721c24; }
        pre { background: #f8f9fa; padding: 10px; border-radius: 5px; overflow: auto; }
        button { padding: 8px 16px; margin: 5px; cursor: pointer; }
        input { padding: 8px; margin: 5px; width: 300px; }
    </style>
</head>
<body>
    <div class="container">
        <h1>Simple WebSocket Test</h1>
        
        <div id="status" class="status disconnected">Disconnected</div>
        
        <div>
            <input type="text" id="wsUrl" placeholder="wss://your-api-id.execute-api.region.amazonaws.com/prod">
            <button onclick="connect()">Connect</button>
            <button onclick="disconnect()">Disconnect</button>
        </div>
        
        <div>
            <h3>Send Message</h3>
            <textarea id="messageInput" rows="5" cols="50" style="width: 100%;">{
  "action": "subscribe",
  "sensorId": "device1"
}</textarea>
            <button onclick="sendMessage()">Send</button>
        </div>
        
        <div>
            <h3>Quick Actions</h3>
            <button onclick="sendSubscribe('device1')">Subscribe device1</button>
            <button onclick="sendSubscribe('device2')">Subscribe device2</button>
            <button onclick="sendGetLatest()">Get Latest</button>
        </div>
        
        <div>
            <h3>Messages</h3>
            <button onclick="clearMessages()">Clear</button>
            <div id="messages" style="max-height: 400px; overflow-y: auto;"></div>
        </div>
    </div>

    <script>
        let ws = null;
        
        function connect() {
            const url = document.getElementById('wsUrl').value;
            if (!url) {
                alert('Please enter WebSocket URL');
                return;
            }
            
            try {
                ws = new WebSocket(url);
                
                ws.onopen = function() {
                    updateStatus('Connected', true);
                    logMessage('System', 'Connected to WebSocket');
                };
                
                ws.onmessage = function(event) {
                    logMessage('Received', event.data);
                    
                    try {
                        const data = JSON.parse(event.data);
                        if (data.type === 'error') {
                            console.error('Error from server:', data.message);
                        }
                    } catch (e) {
                        console.error('Failed to parse message:', e);
                    }
                };
                
                ws.onclose = function() {
                    updateStatus('Disconnected', false);
                    logMessage('System', 'Disconnected from WebSocket');
                };
                
                ws.onerror = function(error) {
                    logMessage('Error', 'WebSocket error occurred');
                    console.error('WebSocket error:', error);
                };
                
            } catch (error) {
                logMessage('Error', 'Connection error: ' + error.message);
            }
        }

        function disconnect() {
            if (ws) {
                ws.close();
                ws = null;
            }
        }

        function sendMessage() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('WebSocket is not connected');
                return;
            }
            
            const messageText = document.getElementById('messageInput').value;
            try {
                // Validate JSON
                const messageObj = JSON.parse(messageText);
                ws.send(messageText);
                logMessage('Sent', messageText);
                
                // Debug info
                console.log('Message sent:', messageObj);
                if (messageObj.action === 'subscribe') {
                    console.log('Subscription request for:', messageObj.sensorId || messageObj.sensor_id);
                }
            } catch (e) {
                alert('Invalid JSON: ' + e.message);
            }
        }
        
        function sendSubscribe(sensorId) {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('WebSocket is not connected');
                return;
            }
            
            // Try both formats to debug which one works
            const message = JSON.stringify({
                action: 'subscribe',
                sensorId: sensorId
            });
            
            ws.send(message);
            logMessage('Sent', message);
            console.log('Subscription request sent for:', sensorId);
            
            // Also try with sensor_id format
            setTimeout(() => {
                if (ws && ws.readyState === WebSocket.OPEN) {
                    const altMessage = JSON.stringify({
                        action: 'subscribe',
                        sensor_id: sensorId
                    });
                    ws.send(altMessage);
                    logMessage('Sent (alt format)', altMessage);
                    console.log('Alternative subscription format sent for:', sensorId);
                }
            }, 1000);
        }
        
        function sendGetLatest() {
            if (!ws || ws.readyState !== WebSocket.OPEN) {
                alert('WebSocket is not connected');
                return;
            }
            
            const message = JSON.stringify({
                action: 'get_latest'
            });
            
            ws.send(message);
            logMessage('Sent', message);
        }

        function updateStatus(status, connected) {
            const statusEl = document.getElementById('status');
            statusEl.textContent = status;
            statusEl.className = 'status ' + (connected ? 'connected' : 'disconnected');
        }

        function logMessage(type, message) {
            const messagesEl = document.getElementById('messages');
            const messageEl = document.createElement('div');
            messageEl.style.marginBottom = '10px';
            
            const timestamp = new Date().toISOString();
            
            let formattedMessage;
            try {
                // Try to format as JSON
                const jsonObj = typeof message === 'string' ? JSON.parse(message) : message;
                formattedMessage = JSON.stringify(jsonObj, null, 2);
            } catch (e) {
                formattedMessage = message;
            }
            
            messageEl.innerHTML = `
                <div style="color: #666;">[${timestamp}] ${type}:</div>
                <pre>${formattedMessage}</pre>
            `;
            
            messagesEl.appendChild(messageEl);
            messagesEl.scrollTop = messagesEl.scrollHeight;
        }

        function clearMessages() {
            document.getElementById('messages').innerHTML = '';
        }
    </script>
</body>
</html>
