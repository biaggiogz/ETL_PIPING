S3BucketPermission:
  Type: AWS::Lambda::Permission
  Properties:
    Action: 'lambda:InvokeFunction'
    FunctionName: !GetAtt LambdaFunction.Arn
    Principal: s3.amazonaws.com
    SourceArn: !Sub 'arn:aws:s3:::${BucketName}'

NotificationConfiguration:
  Type: Custom::S3BucketNotification
  Properties:
    ServiceToken: !GetAtt NotificationFunction.Arn
    BucketName: !Ref BucketName
    NotificationConfiguration:
      LambdaFunctionConfigurations:
        - Event: 's3:ObjectCreated:*'
          Filter:
            S3Key:
              Rules:
                - Name: prefix
                  Value: !Ref S3FolderDestinationSheetISOS
          Function: !GetAtt LambdaFunction.Arn

# Lambda function to handle the custom resource
NotificationFunction:
  Type: AWS::Lambda::Function
  Properties:
    Handler: index.handler
    Role: !GetAtt NotificationFunctionRole.Arn
    Code:
      ZipFile: |
        import boto3
        import cfnresponse
        def handler(event, context):
          try:
            if event['RequestType'] == 'Delete':
              cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
              return
        
            bucket_name = event['ResourceProperties']['BucketName']
            notification_configuration = event['ResourceProperties']['NotificationConfiguration']
        
            s3 = boto3.client('s3')
            s3.put_bucket_notification_configuration(
              Bucket=bucket_name,
              NotificationConfiguration=notification_configuration
            )
            cfnresponse.send(event, context, cfnresponse.SUCCESS, {})
          except Exception as e:
            cfnresponse.send(event, context, cfnresponse.FAILED, {'Error': str(e)})
    Runtime: python3.9
    Timeout: 30

NotificationFunctionRole:
  Type: AWS::IAM::Role
  Properties:
    AssumeRolePolicyDocument:
      Version: '2012-10-17'
      Statement:
        - Effect: Allow
          Principal:
            Service: lambda.amazonaws.com
          Action: sts:AssumeRole
    ManagedPolicyArns:
      - arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole
    Policies:
      - PolicyName: S3NotificationAccess
        PolicyDocument:
          Version: '2012-10-17'
          Statement:
            - Effect: Allow
              Action:
                - s3:PutBucketNotification
              Resource: !Sub 'arn:aws:s3:::${BucketName}'
