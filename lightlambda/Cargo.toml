[package]
name = "lightlambda"
version = "0.1.0"
edition = "2021"

[dependencies]
aws_lambda_events = { version = "0.15.1", default-features = false, features = ["s3"] }
lambda_runtime = "0.13.0"
tokio = { version = "1", features = ["macros"] }
tracing = { version = "0.1", features = ["log"] }
tracing-subscriber = { version = "0.3", default-features = false, features = ["fmt"] }
rand = "0.8.5"
chrono = "0.4"
aws-config = "1.0.1"
aws-sdk-s3 = "1.3.0"
tempfile = "3.8.1"
aws-types = "1.0.1"
polars = { version = "0.35.4", features = [
    "lazy",           # For lazy evaluation
    "csv",            # CSV support
    "parquet",        # Parquet support
    "json",           # JSON support
    "strings",        # String operations
    "dtype-datetime"  # DateTime support
] }


[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true

[target.x86_64-unknown-linux-gnu]
rustflags = ["-C", "target-cpu=x86-64-v2"]

[build]
rustflags = ["-C", "link-arg=-fuse-ld=lld"]
