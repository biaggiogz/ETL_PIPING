AWSTemplateFormatVersion: '2010-09-09'
Transform: 'AWS::Serverless-2016-10-31'
Metadata:
  'AWS::ServerlessRepo::Application':
    Name: rds-excel-support
    Labels:
      - piping
      - lambda
      - spark
    SemanticVersion: 1.2.0


Parameters:
  ImageUri:
    Description: 'Mandatory: ECR Uri for the image. If not present, then create and push using the sam-imagebuilder.yaml in the github https://github.com/aws-samples/spark-on-aws-lambda '
    Type: String
    Default: ''
  LambdaTimeout:
    Description: 'Optional: Maximum Lambda invocation runtime in seconds. (min 1 - 900 max)'
    Default: 900
    Type: Number
  LambdaMemory:
    Description: 'Optional: Lambda memory in MB (min 128 - 10,240 max).'
    Default: 3008
    Type: Number
  LambdaName:
    Description: 'Optional: Override the default Lambda function name.'
    Type: String
    Default: ''
  DBNAME:
    Type: String
  BucketName:
    Type: String
    Description: Name of the S3 bucket
  NUMROWS:
    Type: Number
    Description: Number of rows to insert into the database
  CHUNKSIZE:
    Type: Number
    Description: Chunk size for inserting data into the database

Resources:

  LambdaExecutionRole:
    Type: 'AWS::IAM::Role'
    Properties:
      AssumeRolePolicyDocument:
        Version: '2012-10-17'
        Statement:
          - Effect: 'Allow'
            Principal:
              Service:
                - lambda.amazonaws.com
            Action:
              - 'sts:AssumeRole'
      ManagedPolicyArns:
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaBasicExecutionRole'
        - 'arn:aws:iam::aws:policy/service-role/AWSLambdaVPCAccessExecutionRole'
      Policies:
        - PolicyName: 'ECRAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: Allow
                Action:
                  - ecr:GetAuthorizationToken
                Resource: '*'
              - Effect: Allow
                Action:
                  - ecr:BatchCheckLayerAvailability
                  - ecr:GetDownloadUrlForLayer
                  - ecr:BatchGetImage
                Resource:
                  Fn::Sub:
                    - "arn:aws:ecr:${Region}:${Account}:repository/${RepositoryName}"
                    - Region: !Select [3, !Split [".", !Ref ImageUri ]]
                      Account: !Select [0, !Split [".", !Ref ImageUri ]]
                      RepositoryName: !Select [1, !Split ["/", !Select [ 0, !Split [":", !Select [5, !Split [".", !Ref ImageUri ]]]]]]
        - PolicyName: 'S3Access'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 's3:*'
                  - 's3:ListBucketMultipartUploads'
                  - 's3:AbortMultipartUpload'
                  - 's3:ListMultipartUploadParts'
                Resource:
                  - !Sub 'arn:aws:s3:::${BucketName}/RustDf/*'
              - Effect: 'Allow'
                Action:
                  - 's3:*'
                  - 's3:ListBucketMultipartUploads'
                  - 's3:AbortMultipartUpload'
                  - 's3:ListMultipartUploadParts'
                Resource:
                  - !Sub 'arn:aws:s3:::${BucketName}/RustDf/*'
              - Effect: 'Allow'
                Action:
                  - 's3:ListBucket'
                Resource:
                  - !Sub 'arn:aws:s3:::${BucketName}'
        - PolicyName: 'RDSAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'rds-db:*'
                Resource: !Sub 'arn:aws:rds:${AWS::Region}:${AWS::AccountId}:db:${DBNAME}'
        - PolicyName: cloudwatch
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'logs:CreateLogGroup'
                  - 'logs:CreateLogStream'
                  - 'logs:PutLogEvents'
                Resource: !Sub 'arn:aws:logs:${AWS::Region}:${AWS::AccountId}:log-group:/aws/lambda/${AWS::StackName}:*'
        - PolicyName: 'SecretsAccess'
          PolicyDocument:
            Version: '2012-10-17'
            Statement:
              - Effect: 'Allow'
                Action:
                  - 'secretsmanager:GetSecretValue'
                  - 'secretsmanager:DescribeSecret'
                Resource: !Sub 'arn:aws:secretsmanager:${AWS::Region}:${AWS::AccountId}:secret:rdspiping-*'


  LambdaFunction:
    Type: AWS::Serverless::Function
    Properties:
      PackageType: Image
      FunctionName: !Ref LambdaName
      ImageUri: !Ref ImageUri
      Description: Lambda to run Spark containers
      Timeout: !Ref LambdaTimeout
      MemorySize: !Ref LambdaMemory
      Role: !GetAtt LambdaExecutionRole.Arn
      Architectures:
        - arm64
      Environment:
        Variables:
          NUM_ROWS: !Ref NUMROWS
          CHUNK_SIZE: !Ref CHUNKSIZE


Outputs:
  LambdaFunctionArn:
    Description: Lambda Function ARN
    Value: !GetAtt LambdaFunction.Arn

